# Site nginx de production pour l'API Laravel (SCRUM-30).
# Installé dans /etc/nginx/conf.d/default.conf par le Dockerfile.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    # 5 fichiers de 25 Mo + en-têtes multipart (SCRUM-136 / SCRUM-139).
    client_max_body_size 130m;

    # Journaux envoyés sur la sortie standard pour que Render les collecte.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    # On n'expose jamais les fichiers cachés (.env, .git, etc.).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
