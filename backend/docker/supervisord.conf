; Supervisor de production (SCRUM-30).
; Lancé par /usr/local/bin/start.sh et chargé à l'adresse
; /etc/supervisor/conf.d/supervisord.conf.
;
; Un seul conteneur fait tourner les 4 processus :
;   - php-fpm        : exécution de PHP
;   - nginx          : serveur web (proxy FastCGI vers php-fpm)
;   - queue-worker   : traitement des jobs Laravel
;   - scheduler      : tâches planifiées Laravel (schedule:work)

[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0

[program:php-fpm]
command=php-fpm -F
directory=/var/www/html
priority=5
autostart=true
autorestart=true
startsecs=1
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
directory=/var/www/html
priority=10
autostart=true
autorestart=true
startsecs=1
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=php artisan queue:work --tries=3 --timeout=90 --sleep=3 --max-time=3600
directory=/var/www/html
user=www-data
; `user=` ne change pas HOME : sans cette ligne le processus garde HOME=/root.
; Avec une base en SSL (Neon : sslmode=require), libpq cherche alors
; /root/.postgresql/postgresql.crt, n'a pas le droit de lire /root et la connexion
; échoue (« could not open certificate file ... Permission denied »).
environment=HOME="/var/www"
priority=20
autostart=true
autorestart=true
startsecs=1
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php artisan schedule:work
directory=/var/www/html
user=www-data
; Même raison que queue-worker : HOME de www-data, pas celui de root.
environment=HOME="/var/www"
priority=20
autostart=true
autorestart=true
startsecs=1
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
