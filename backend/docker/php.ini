; SCRUM-136 / SCRUM-139 : pièces jointes des messages et des annonces.
;
; L'API accepte jusqu'à 5 fichiers de 25 Mo chacun. Les valeurs par défaut de
; PHP (2 Mo par fichier, 8 Mo par requête) refuseraient silencieusement les
; photos et PDF envoyés depuis un téléphone : on les aligne sur les règles de
; la plateforme. `max_file_uploads` reste au-dessus de 5 pour que la validation
; Laravel renvoie bien un 422 au sixième fichier.
upload_max_filesize = 25M
post_max_size = 130M
max_file_uploads = 10
max_input_time = 300
