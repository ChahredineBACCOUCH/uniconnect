services:
  postgres:
    image: postgres:16
    container_name: uniconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uniconnect
      POSTGRES_USER: uniconnect
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniconnect -d uniconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: uniconnect-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface web

volumes:
  pgdata: