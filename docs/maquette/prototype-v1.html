<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UniConnect v1.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap">
<style>
/* Layout : bandeau de version + app Vuetify (app bar, menu latéral, contenu) ; menu bas sur téléphone */
:root{
  --bg:#F4F6FB;--surface:#FFFFFF;--surface-2:#EEF2FA;--line:#D5DBE7;--fg:#1C2333;--muted:#5B6478;
  --primary:#1E4FB8;--on-primary:#FFFFFF;--primary-soft:#E3EBFB;--primary-hover:#163C8C;
  --ai:#B45309;--ai-soft:#FEF3DC;--ok:#1B5E20;--ok-soft:#E3F1E4;--warn:#8A4100;--warn-soft:#FDEBD9;--err:#B71C1C;--err-soft:#FBE4E4;
  --strip:#14254F;--strip-fg:#E3EBFB;--jira:#0B57D0;--scrim:rgba(15,20,32,.5);--snack:#2B3140;--snack-fg:#FFFFFF;
  --font:Roboto,"Segoe UI",Arial,sans-serif;--mono:"Roboto Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1420;--surface:#171D2B;--surface-2:#1F2737;--line:#2C3547;--fg:#E6EAF2;--muted:#9AA4B8;
  --primary:#8AB0FF;--on-primary:#0F1420;--primary-soft:#1D2C4F;--primary-hover:#A9C4FF;
  --ai:#F2B35B;--ai-soft:#3A2A12;--ok:#8BD49A;--ok-soft:#173222;--warn:#F5B27A;--warn-soft:#3A2614;--err:#F49A9A;--err-soft:#3B1A1A;
  --strip:#0A0F1A;--strip-fg:#C9D6F2;--jira:#8AB0FF;--scrim:rgba(0,0,0,.6);--snack:#E6EAF2;--snack-fg:#0F1420;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1420;--surface:#171D2B;--surface-2:#1F2737;--line:#2C3547;--fg:#E6EAF2;--muted:#9AA4B8;
  --primary:#8AB0FF;--on-primary:#0F1420;--primary-soft:#1D2C4F;--primary-hover:#A9C4FF;
  --ai:#F2B35B;--ai-soft:#3A2A12;--ok:#8BD49A;--ok-soft:#173222;--warn:#F5B27A;--warn-soft:#3A2614;--err:#F49A9A;--err-soft:#3B1A1A;
  --strip:#0A0F1A;--strip-fg:#C9D6F2;--jira:#8AB0FF;--scrim:rgba(0,0,0,.6);--snack:#E6EAF2;--snack-fg:#0F1420;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--strip)}
h1,h2,h3,p{margin:0}h1,h2{text-wrap:balance}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.i{width:22px;height:22px;fill:currentColor;flex:none}
.muted{color:var(--muted)}.cap{font-size:12px;line-height:16px;color:var(--muted)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* bandeau de version */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.strip{background:var(--strip);color:var(--strip-fg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:8px}
.strip .ver{font-weight:700;letter-spacing:.02em}
.strip .meta{font-size:12px;opacity:.8}
.strip .sp{flex:1}
.seg{display:inline-flex;border:1px solid color-mix(in srgb,var(--strip-fg) 40%,transparent);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--strip-fg);padding:4px 12px;font-size:12px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--strip-fg);color:var(--strip)}
.strip-btn{background:transparent;border:1px solid color-mix(in srgb,var(--strip-fg) 40%,transparent);color:var(--strip-fg);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.strip-btn[aria-pressed="true"]{background:var(--strip-fg);color:var(--strip)}

/* app bar */
.appbar{background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;color:var(--primary);text-decoration:none;flex:none;background:none;border:0;cursor:pointer;padding:0}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.brand-mark .i{width:20px;height:20px}
.admin-tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--ai-soft);color:var(--ai);border-radius:4px;padding:2px 6px}
.search{flex:0 1 460px;display:flex;align-items:center;gap:10px;height:42px;padding:0 16px;border-radius:999px;background:var(--surface-2);color:var(--muted);margin-left:24px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--fg)}
.spacer{flex:1}
.icon-btn{position:relative;width:42px;height:42px;border:0;border-radius:999px;background:transparent;color:var(--muted);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.dot{position:absolute;top:3px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#C62828;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.user{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px;border-radius:8px;text-align:left}
.user:hover{background:var(--surface-2)}
.av{width:38px;height:38px;border-radius:999px;display:inline-grid;place-items:center;font-weight:500;color:#fff;flex:none;font-size:14px}

/* structure */
.layout{display:flex;align-items:flex-start}
.drawer{width:272px;flex:none;align-self:stretch;min-height:calc(100vh - 100px);background:var(--surface);border-right:1px solid var(--line);padding:16px 12px 32px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
.sub{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;min-height:42px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:var(--fg);text-align:left;cursor:pointer;width:100%}
.nav:hover{background:var(--surface-2)}
.nav .i{color:var(--muted);width:20px;height:20px}
.nav.on{background:var(--primary-soft);color:var(--primary);font-weight:500}.nav.on .i{color:var(--primary)}
.nav .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-size:11px;font-weight:700;line-height:20px;text-align:center}
.main{flex:1;min-width:0;padding-block:24px 56px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:60px;border:0;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;position:relative}
.bnav button.on{color:var(--primary);font-weight:500}
.bnav .dot{top:4px;right:calc(50% - 22px)}
body[data-mode="auth"] .appbar,body[data-mode="auth"] .drawer,body[data-mode="auth"] .bnav{display:none!important}
body[data-mode="auth"] .main{padding:0}

/* éléments */
.ph{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ph-text{flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px}
.ph h1{font-size:24px;line-height:32px;font-weight:500}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.pad{padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:4px;border:1px solid transparent;font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;background:transparent;color:var(--primary);text-decoration:none}
.btn .i{width:18px;height:18px}
.btn-primary{background:var(--primary);color:var(--on-primary)}.btn-primary:hover{background:var(--primary-hover)}
.btn-outline{border-color:var(--primary)}.btn-outline:hover,.btn-text:hover{background:var(--primary-soft)}
.btn-danger{background:#C62828;color:#fff}
.btn-ai{background:var(--ai);color:var(--surface)}
.btn[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed;border-color:transparent}
.btn-sm{min-height:32px;padding:0 10px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.c-primary{background:var(--primary-soft);color:var(--primary)}.c-ok{background:var(--ok-soft);color:var(--ok)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-err{background:var(--err-soft);color:var(--err)}.c-ai{background:var(--ai-soft);color:var(--ai)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;height:30px;padding:0 12px;border-radius:999px;font-size:13px}
.fchip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary-soft);color:var(--primary);font-weight:500}
.jira-row{display:inline-flex;flex-wrap:wrap;gap:6px}
.jira{font:500 11px/18px var(--mono);color:var(--jira);border:1px dashed var(--jira);border-radius:4px;padding:0 6px;text-decoration:none;white-space:nowrap}
.jira:hover{background:var(--primary-soft)}
body:not(.show-jira) .jira-row{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:6px;height:46px;padding:0 14px;font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:0;border-bottom:2px solid transparent;background:transparent;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--surface-2);color:var(--fg)}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}
.fld{display:flex;flex-direction:column;gap:4px;position:relative}
.fld label{font-size:12px;color:var(--muted);font-weight:500}
.inp{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:11px 14px;font-size:15px;outline:0;width:100%;min-width:0}
.inp:focus{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.inp[readonly]{background:var(--surface-2);border-style:dashed;color:var(--muted)}
.err-msg{font-size:12px;color:var(--err)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:8px;background:var(--primary-soft);color:var(--fg)}
.alert .i{color:var(--primary)}
.alert-warn{background:var(--warn-soft)}.alert-warn .i{color:var(--warn)}
.alert-err{background:var(--err-soft)}.alert-err .i{color:var(--err)}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 16px;border-bottom:1px solid var(--surface-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:12px}
.who .av{width:32px;height:32px;font-size:12px}
.switch{position:relative;width:36px;height:20px;flex:none;display:inline-block}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch .tr{position:absolute;inset:0;border-radius:999px;background:var(--line)}
.switch .th{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.switch input:checked~.tr{background:var(--primary)}.switch input:checked~.th{left:18px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--surface-2)}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* auth */
.auth{display:flex;flex-wrap:wrap;min-height:calc(100vh - 44px)}
.auth-brand{flex:1 1 50%;background:var(--primary);color:var(--on-primary);padding:56px max(24px,env(safe-area-inset-left,0px)) 56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.auth-brand h1{font-size:34px;line-height:40px;font-weight:500;max-width:440px}
.auth-form{flex:1 1 50%;display:flex;align-items:center;justify-content:center;padding:40px max(16px,env(safe-area-inset-right,0px)) 40px 16px}
.auth-card{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:36px;display:flex;flex-direction:column;gap:18px}
.rules{display:flex;flex-direction:column;gap:4px}
.rule{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.rule.ok{color:var(--ok)}
.rule .i{width:16px;height:16px}
.meter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.meter span{height:4px;border-radius:2px;background:var(--line)}

/* accueil */
.spaces{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.sp-card{display:flex;flex-direction:column;gap:10px;padding:18px;text-align:left;cursor:pointer;color:var(--fg)}
.sp-card:hover{border-color:var(--primary)}
.sp-ico{width:42px;height:42px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}

/* espace */
.space-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.space-head .sp-ico{width:48px;height:48px;border-radius:12px}
.msgs{display:flex;flex-direction:column}
.msg{display:flex;gap:12px;padding:12px 20px;position:relative}
.msg:hover{background:var(--surface-2)}
.msg .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.msg .meta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg .acts{display:flex;gap:4px;flex-wrap:wrap}
.file{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);align-self:flex-start;cursor:pointer;color:var(--fg)}
.file .i{color:#C62828}
.composer{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.compose-row{display:flex;gap:8px;align-items:flex-end}
.compose-row textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:var(--surface);outline:0;min-height:44px}
.compose-row textarea:focus{border-color:var(--primary)}
.sum{border:1px solid color-mix(in srgb,var(--ai) 40%,var(--line));background:var(--ai-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;margin:16px 20px 4px}
.sum ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.typing{display:inline-flex;gap:3px}.typing span{width:6px;height:6px;border-radius:99px;background:var(--ai);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing span{animation:none;opacity:.7}.switch .th{transition:none}}
.ai-wrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.ai-chat{display:flex;flex-direction:column}
.ai-msgs{display:flex;flex-direction:column;gap:16px;padding:20px}
.q{align-self:flex-end;max-width:80%;background:var(--primary);color:var(--on-primary);padding:10px 14px;border-radius:16px 16px 4px 16px}
.a{display:flex;gap:12px;align-items:flex-start}
.ai-av{width:34px;height:34px;border-radius:999px;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;flex:none}
.ai-av .i{width:18px;height:18px}
.a-body{flex:1;min-width:0;background:var(--surface-2);border-radius:4px 16px 16px 16px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.a-body ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.srcs{display:flex;gap:8px;flex-wrap:wrap}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;color:var(--fg);cursor:pointer}
.fb{display:flex;align-items:center;gap:4px}
.fbb{width:32px;height:32px;border-radius:999px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.fbb.on{background:var(--primary-soft);color:var(--primary)}
.fbb .i{width:16px;height:16px}
.sugg{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 16px}
.sugg button{border:1px solid color-mix(in srgb,var(--ai) 45%,var(--line));background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;text-align:left}
.chap{border-bottom:1px solid var(--line)}.chap:last-child{border-bottom:0}
.chap-h{display:flex;align-items:center;gap:12px;width:100%;padding:14px 20px;border:0;background:transparent;text-align:left;cursor:pointer;color:var(--fg)}
.chap-h:hover{background:var(--surface-2)}

/* admin */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .n{font-size:28px;line-height:36px;font-weight:500;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;padding:24px 20px 0;border-bottom:1px solid var(--line);margin:0 20px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar .v{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar .b{width:70%;max-width:38px;background:var(--primary);border-radius:4px 4px 0 0}
.xl{display:flex;gap:10px;margin:6px 40px 16px}.xl span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.hrow{display:grid;grid-template-columns:110px minmax(0,1fr) 56px;gap:12px;align-items:center}
.htr{height:12px;background:var(--surface-2);border-radius:0 4px 4px 0}.hf{height:100%;background:var(--primary);border-radius:0 4px 4px 0}
.md{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.md-list{flex:1 1 280px;max-width:360px;overflow:hidden}
.md-det{flex:999 1 420px}
.u{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;border:0;border-top:1px solid var(--surface-2);background:transparent;text-align:left;cursor:pointer;color:var(--fg)}
.u:hover{background:var(--surface-2)}.u.on{background:var(--primary-soft);box-shadow:inset 3px 0 0 var(--primary)}
.rights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px}
.right{display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer}
.right input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--primary)}
.rep{display:flex;gap:16px;padding:16px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.quote{border-left:3px solid var(--line);padding:6px 12px;background:var(--surface-2);border-radius:0 6px 6px 0}

/* dialogue, snackbar */
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--surface);border-radius:12px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.dlg h2{font-size:20px;font-weight:500}
.dlg-act{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pick{display:flex;align-items:center;gap:12px;padding:8px 4px;border-radius:6px;cursor:pointer}
.pick:hover{background:var(--surface-2)}
.pick input{width:18px;height:18px;margin:0;accent-color:var(--primary)}

function tEpingles() {

    <p style="font-weight:500">${a.intro}</p><ul>${a.points.map((p) => `<li>${p}</li>`).join("")}</ul>${a.outro ? `<p>${a.outro}</p>` : ""}

    <aside style="border-left:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px;align-self:stretch">
      ${isT() ? `<label class="row" style="padding-top:0;cursor:pointer"><span class="grow"><strong>Assistant activé</strong><span class="cap" style="display:block">Pour les étudiants de cet espace</span></span><span class="switch"><input type="checkbox" data-act="aiOn"${S.aiOn ? " checked" : ""} aria-label="Activer l'assistant"><span class="tr"></span><span class="th"></span></span></label><div class="row"><span class="grow">Avis des étudiants (7 jours)</span><span class="chip c-ok">86 % utiles</span></div>` : ""}

function searchResults() {
  const q = S.search.trim().toLowerCase();
  if (q.length < 2) return `<div class="empty">Saisissez au moins 2 caractères.</div>`;
  const has = (s) => s.toLowerCase().includes(q);
  const groups = [
    ["Espaces", SPACES.filter((s) => has(s.name)).map((s) => `<button class="row nav" type="button" data-act="go" data-a="espace" data-b="${s.id}" style="padding:10px 0;min-height:0">${ico(s.icon)}<span class="lbl">${esc(s.name)}</span><span class="cap">${s.type}</span></button>`)],
    ["Personnes", MEMBERS.filter((m) => has(m[2])).map((m) => `<div class="row">${av(m[0], m[1], "width:32px;height:32px;font-size:12px")}<span class="grow">${m[2]}</span><span class="cap">${m[4]}</span></div>`)],
    ["Fichiers et ressources", [...S.files.map((f) => f[0]), ...CH.flatMap((c) => c.items.map((x) => x[0]))].filter(has).map((n) => `<div class="row">${ico("file", "color:#C62828")}<span class="grow">${esc(n)}</span><span class="cap">Bases de données</span></div>`)],
    ["Messages", S.msgs.filter((m) => has(m.text)).map((m) => `<div class="row">${av(m.ini, m.c, "width:32px;height:32px;font-size:12px")}<span class="grow">${esc(m.text)}</span><span class="cap">${m.time}</span></div>`)]
  ].filter((g) => g[1].length);
  if (!groups.length) return `<div class="empty">Aucun résultat pour « ${esc(S.search)} » dans vos espaces.</div>`;
  return groups.map(([t, rows]) => `<section class="card" style="padding:12px 20px"><h2 class="sub" style="padding:4px 0">${t} · ${rows.length}</h2>${rows.join("")}</section>`).join("");
}
function vSearch() {
  return head("Recherche", "Dans les espaces dont vous êtes membre uniquement.", ["39"]) +
  `<label class="search" style="margin:0;flex:none;max-width:560px;width:100%"><span class="muted">${ico("magnify")}</span><input id="q-main" value="${esc(S.search)}" data-live="search" aria-label="Rechercher"></label><div id="results" style="display:flex;flex-direction:column;gap:16px">${searchResults()}</div>`;

/* ===== Rendu et actions ===== */
const VIEWS = { connexion: vAuth, accueil: vHome, espace: vSpace, channels: vChannels, notifications: vNotifs, recherche: vSearch, profil: vProfil, contenu: vContenu,
  "admin-dashboard": vDash, "admin-annees": vAnnees, "admin-referentiels": vRef, "admin-comptes": vComptes, "admin-droits": vDroits, "admin-visibilite": vVisib, "admin-groupes": vGroupes, "admin-moderation": vModeration, "admin-historique": vHisto };
const $ = (id) => document.getElementById(id);
function render() {
  document.body.classList.toggle("show-jira", S.jira);
  document.body.dataset.mode = S.view === "connexion" ? "auth" : "app";
  $("strip").innerHTML = stripHtml();
  $("appbar").innerHTML = barHtml();
  $("drawer").innerHTML = drawerHtml();
  $("bnav").innerHTML = bnavHtml();
  $("main").innerHTML = S.view.startsWith("admin") && S.role !== "admin" ? vForbidden() : (VIEWS[S.view] || vHome)();
  $("dlg").innerHTML = dlgHtml();
  const f = $("dlg").querySelector("input,textarea,select,button.file"); if (f) f.focus();
}
function go(view, b) {
  if (view === "espace") { if (b) S.space = b; if (!b || !S.tab) S.tab = S.tab || "discussion"; }
  S.view = view; S.dialog = null;
  try { history.replaceState(null, "", "#" + view); } catch (e) { /* ignoré */ }
  render(); window.scrollTo(0, 0);
}
let tId;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tId); tId = setTimeout(() => { t.hidden = true; }, 3600); }
function ask(text, key) {
  const q = (text || "").trim(); if (!q || S.quota <= 0) return;
  const s = q.toLowerCase();
  const k = key || (/3fn|forme normale|normal/.test(s) ? "fn" : /dépendance|dependance|\bdf\b/.test(s) ? "df" : /tp ?2|rendre|date limite/.test(s) ? "tp" : "none");
  const idx = S.ai.length; S.ai.push({ k, q, done: false, fb: "" }); S.quota--; render();
  setTimeout(() => { if (S.ai[idx]) { S.ai[idx].done = true; if (S.view === "espace" && S.tab === "assistant") render(); } }, 1300);
}
const ACT = {
  role: (a) => { S.role = a; if (S.view === "connexion") { render(); return; } if (a === "admin" && S.view === "accueil") S.view = "admin-dashboard"; render(); toast("Vous voyez maintenant l'application en tant que : " + me().sub.split(" · ")[0] + "."); },
  jira: () => { S.jira = !S.jira; render(); },
  go: (a, b) => go(a, b),
  open: (a) => { const [v, sub] = a.split(":"); if (v.startsWith("admin")) S.role = "admin"; if (v === "connexion") S.authMode = sub || "login"; if (v === "espace") { S.tab = sub; S.space = "bd"; } go(v); },
  auth: (a) => { S.authMode = a; render(); },
  logout: () => { S.authMode = "login"; go("connexion"); toast("Vous êtes déconnecté."); },
  tab: (a) => { S.tab = a; render(); },
  dlg: (a, b) => { S.dialog = { type: a, id: b }; if (a === "import") S.imp = "choose"; render(); },
  close: () => { S.dialog = null; render(); },
  scrim: (a, b, t, e) => { if (e.target === t) ACT.close(); },
  toast: (a) => toast(a),
  dl: (a) => toast(`Téléchargement de « ${a} » : lien protégé, valable 5 minutes (démo).`),
  pin: (a) => { const m = S.msgs.find((x) => x.id === Number(a)); m.pinned = !m.pinned; render(); toast(m.pinned ? "Message épinglé : il n'expirera pas." : "Message désépinglé."); },
  attach: () => { S.att = ["requetes-tp2-binome.sql", "12 Ko"]; render(); $("draft").focus(); },
  unattach: () => { S.att = null; render(); },
  sum: () => { S.sum = "loading"; render(); setTimeout(() => { S.sum = "done"; if (S.view === "espace" && S.tab === "discussion") render(); }, 1500); },
  sugg: (a) => ask(QA[a].q, a),
  fb: (a, b) => { const e = S.ai[Number(a)]; e.fb = e.fb === b ? "" : b; render(); },
  aiOn: () => { S.aiOn = !S.aiOn; render(); toast(S.aiOn ? "Assistant activé pour les étudiants." : "Assistant désactivé pour les étudiants."); },
  chap: (a) => { S.openCh[a] = !S.openCh[a]; render(); },
  join: (a) => { const c = S.channels[Number(a)]; if (c.st === "joined") { c.st = ""; toast(`Vous avez quitté ${c.n}.`); } else if (c.mode === "Sur demande") { c.st = "req"; toast("Demande envoyée aux gestionnaires du channel."); } else { c.st = "joined"; toast(`Vous avez rejoint ${c.n}.`); } render(); },
  read: (a) => { S.notifs.find((n) => n.id === Number(a)).unread = false; render(); },
  allRead: () => { S.notifs.forEach((n) => { n.unread = false; }); render(); },
  invite: (a, b) => { const n = S.notifs.find((x) => x.id === Number(a)); n.state = b; n.unread = false; render(); toast(b === "ok" ? "Invitation acceptée : « Révisions BD » est dans vos espaces." : "Invitation refusée."); },
  ptab: (a) => { S.profileTab = a; render(); },
  pref: (a, b) => { const p = S.prefs[Number(a)]; p[Number(b)] = !p[Number(b)]; },
  compf: (a) => { S.compFilter = a; render(); },
  imp: (a) => { if (a === "done") { S.dialog = null; S.log.unshift(["Maintenant", "Leila Haddad", "Import de comptes autorisés", "comptes-L2-2026.csv · 309 lignes"]); render(); toast("309 comptes autorisés importés."); } else { S.imp = a; render(); } },
  selu: (a) => { S.selUser = a; render(); },
  right: (a) => { const r = S.rights[S.selUser]; r[a] = r[a] ? 0 : 1; },
  unsusp: () => { S.susp[S.selUser] = ""; render(); toast("Suspension levée."); },
  gen: () => { S.groupsGenerated = true; render(); toast("Groupes de 2026/2027 générés."); },
  mod: (a, b) => { const r = S.reports.find((x) => x.id === a); r.st = b; S.log.unshift(["Maintenant", "Leila Haddad", "Signalement traité", { kept: "Conservé", deleted: "Message supprimé", warned: "Auteur averti" }[b] + " · " + r.where]); render(); toast("Signalement traité. L'auteur du signalement est notifié."); }
};
const SUBMIT = {
  login: () => { go(S.role === "admin" ? "admin-dashboard" : "accueil"); toast(`Connecté en tant que ${me().name}.`); },
  register: (f) => { const mail = f.querySelector("#r-mail").value.trim(); const err = $("r-err"); if (!/@univ\.tn$/i.test(mail)) { err.hidden = false; return; } S.authMode = "sent"; render(); },
  activate: () => { if (!pwdChecks(S.pwd).every((c) => c[1])) return; S.role = "etudiant"; go("accueil"); toast("Compte activé. Vous avez rejoint 4 espaces automatiquement."); },
  forgot: () => { S.authMode = "forgotSent"; render(); },
  search: (f) => { S.search = f.q.value; go("recherche"); },
  send: (f) => { const t = f.t.value.trim(); if (!t && !S.att) return; const u = me(); S.msgs.push({ id: Date.now(), ini: u.ini, c: u.color, name: u.name, role: isT() ? "Enseignante" : "", time: "À l'instant", text: t || "Pièce jointe", file: S.att, days: 30 }); if (S.att) S.files.unshift([S.att[0], u.name, "Aujourd'hui", S.att[1]]); S.att = null; render(); },
  ask: (f) => ask(f.q.value),
  annonce: (f) => { S.annonces.unshift([f.t.value, f.b.value, "Aujourd'hui"]); render(); toast("Annonce publiée. Les 48 membres sont notifiés."); },
  report: (f) => { const m = S.msgs.find((x) => x.id === Number(S.dialog.id)); m.reported = true; S.reports.unshift({ id: "r" + Date.now(), where: curSpace().name, author: m.name, text: m.text, reason: f.reason.value, comment: f.c.value.trim(), date: "À l'instant", n: 1, st: "open" }); S.dialog = null; render(); toast("Signalement envoyé à la modération. Merci."); },
  create: (f) => { const n = f.n.value.trim() || "Nouveau groupe"; const id = "g" + Date.now(); SPACES.push({ id, name: n, short: n, type: "Groupe privé", icon: "lock", members: 1, unread: 0, last: "Groupe créé à l'instant." }); S.dialog = null; S.tab = "discussion"; go("espace", id); toast("Groupe créé. Les invitations sont envoyées."); },
  invite: () => { S.dialog = null; render(); toast("Invitation envoyée. Elle expire dans 14 jours."); },
  suspend: (f) => { const m = f.m.value.trim(); if (m.length < 5) { $("su-err").hidden = false; return; } const d = new Date(2026, 10, 26); d.setDate(d.getDate() + Number(f.d.value)); const u = ADM_USERS.find((x) => x.k === S.selUser); S.susp[S.selUser] = d.toLocaleDateString("fr-FR"); S.log.unshift(["Maintenant", "Leila Haddad", "Compte suspendu", u.name + " · " + m]); S.dialog = null; render(); toast("Compte suspendu. Le motif est enregistré dans l'historique."); },
  pwdchange: () => { if (pwdChecks(S.pwd).every((c) => c[1])) toast("Mot de passe modifié. Vos autres sessions sont déconnectées."); }
};
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  if (t.tagName === "INPUT") return;
  const fn = ACT[t.dataset.act]; if (fn) fn(t.dataset.a, t.dataset.b, t, e);
});
document.addEventListener("change", (e) => {
  const t = e.target; if (t.tagName === "INPUT" && t.dataset.act && ACT[t.dataset.act]) ACT[t.dataset.act](t.dataset.a, t.dataset.b, t, e);
});
document.addEventListener("input", (e) => {
  const t = e.target, live = t.dataset && t.dataset.live;
  if (live === "pwd") { S.pwd = t.value; $("rules-box").innerHTML = rulesHtml(); const b = $("act-btn"); if (b) b.disabled = !pwdChecks(S.pwd).every((c) => c[1]); }
  if (live === "search") { S.search = t.value; $("results").innerHTML = searchResults(); }
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-submit]"); if (!f) return;
  e.preventDefault(); SUBMIT[f.dataset.submit](f);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.dialog) ACT.close();
  if (e.key === "Enter" && !e.shiftKey && e.target.tagName === "TEXTAREA" && (e.target.id === "draft" || e.target.id === "ai-q")) { e.preventDefault(); e.target.form.requestSubmit(); }
});
(function init() {
  const h = location.hash.slice(1);
  if (VIEWS[h]) { S.view = h; if (h.startsWith("admin")) S.role = "admin"; }
  render();
})();
</script>

</html>
