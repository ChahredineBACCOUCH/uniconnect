<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniConnect · Maquette v1.0 (livraison du 19/11/2026)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<!--
  Maquette cliquable de la version livrée le 19/11/2026 (sprints S0, S1 et S2).
  Un seul fichier, sans dépendance : HTML + CSS + JavaScript, données de démonstration fictives.
  Les fonctions marquées « v1.1 » dans Jira (mot de passe oublié, annuaire des channels,
  signalement et modération, historique, tableau de bord, recherche, résumé IA, profil…)
  ne sont volontairement PAS représentées : voir le bouton « Périmètre v1.0 ».
-->
<style>
:root {
  --primary: #1E4FB8; --primary-soft: #E3EBFB; --secondary: #00796B; --secondary-soft: #DDF2EF;
  --accent: #F59E0B; --error: #C62828; --error-soft: #FDECEC; --warning: #ED6C02; --warning-soft: #FEF3DC;
  --success: #2E7D32; --success-soft: #E5F4E6; --info: #0288D1;
  --bg: #F4F6FB; --surface: #FFFFFF; --surface-variant: #EEF2FA; --on-surface: #1C2333;
  --muted: #5B6478; --outline: #DCE1EC; --radius: 12px;
  --shadow: 0 1px 2px rgba(28,35,51,.06), 0 2px 8px rgba(28,35,51,.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: Roboto, system-ui, sans-serif; font-size: 14px; color: var(--on-surface); background: var(--bg); line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
.i { width: 20px; height: 20px; fill: currentColor; flex: none; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.date-cap::first-letter { text-transform: uppercase; }

/* Bandeau de présentation (n'existe pas dans l'application) */
.strip { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 16px; background: #1C2333; color: #fff; font-size: 13px; }
.strip strong { font-weight: 500; }
.strip .sep { flex: 1; }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: #fff; padding: 4px 12px; }
.seg button[aria-pressed="true"] { background: #fff; color: #1C2333; font-weight: 500; }
.strip-btn { border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; border-radius: 999px; padding: 4px 12px; display: inline-flex; gap: 6px; align-items: center; }

/* Mise en page de l'application */
.app { display: grid; grid-template-columns: 288px 1fr; grid-template-rows: 64px 1fr; min-height: calc(100vh - 41px); }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--outline); }
.brand { display: flex; align-items: center; gap: 10px; border: 0; background: none; font-size: 20px; font-weight: 700; color: var(--primary); padding: 0; }
.brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--primary); color: #fff; }
.search { flex: 1; max-width: 520px; display: flex; align-items: center; gap: 8px; background: var(--surface-variant); border-radius: 999px; padding: 8px 16px; color: var(--muted); }
.search span { font-size: 13px; }
.top-sep { flex: 1; }
.icon-btn { position: relative; display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 50%; background: none; color: var(--muted); }
.icon-btn:hover { background: var(--surface-variant); }
.dot { position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--error); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.user { display: flex; align-items: center; gap: 10px; }
.avatar { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 13px; font-weight: 700; flex: none; }
.avatar.sm { width: 32px; height: 32px; font-size: 12px; }
.user-text { display: flex; flex-direction: column; line-height: 1.2; }
.user-text b { font-weight: 500; }
.user-text span { font-size: 12px; color: var(--muted); letter-spacing: .03em; }
.menu-btn { display: none; }

.drawer { background: var(--surface); border-right: 1px solid var(--outline); padding: 16px 12px; overflow-y: auto; }
.nav-title { margin: 16px 12px 6px; font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.nav-item { width: 100%; display: flex; align-items: center; gap: 14px; padding: 10px 12px; border: 0; border-radius: 10px; background: none; text-align: left; }
.nav-item:hover { background: var(--surface-variant); }
.nav-item[aria-current="page"] { background: var(--primary-soft); color: var(--primary); font-weight: 500; }
.nav-item .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }
.divider { height: 1px; background: var(--outline); margin: 10px 0; }

.main { padding: 24px 32px 40px; overflow-x: hidden; }
.page { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.page-head > div { flex: 1; min-width: 0; }
.page-head h1 { font-size: 24px; font-weight: 500; }
.bottom-nav { display: none; }

/* Composants */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 8px; border: 0; font-weight: 500; letter-spacing: .02em; }
.btn.primary { background: var(--primary); color: #fff; }
.btn.primary:hover { background: #18409a; }
.btn.outlined { background: none; border: 1px solid var(--primary); color: var(--primary); }
.btn.text { background: none; color: var(--primary); }
.btn.danger { background: none; color: var(--error); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.card { background: var(--surface); border: 1px solid var(--outline); border-radius: var(--radius); }
.card-pad { padding: 20px; }
.card h2 { font-size: 18px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 500; background: var(--surface-variant); color: var(--on-surface); border: 1px solid transparent; }
.chip.primary { background: var(--primary-soft); color: var(--primary); }
.chip.secondary { background: var(--secondary-soft); color: var(--secondary); }
.chip.warning { background: var(--warning-soft); color: #8A4100; }
.chip.success { background: var(--success-soft); color: var(--success); }
.chip.outlined { background: none; border-color: var(--outline); }
.chip.btnchip { cursor: pointer; height: 32px; font-size: 13px; }
.chip.btnchip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; font-size: 13px; }
.alert.info { background: var(--primary-soft); color: #173E92; }
.alert.success { background: var(--success-soft); color: #1F5F23; }
.alert.warning { background: var(--warning-soft); color: #7A3A00; }
.alert.error { background: var(--error-soft); color: #8E1C1C; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 500; }
.input, select.input, textarea.input { width: 100%; height: 44px; padding: 0 14px; border: 1px solid #C3CADA; border-radius: 8px; background: var(--surface); }
textarea.input { height: auto; min-height: 88px; padding: 10px 14px; resize: vertical; }
.input:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
.hint { font-size: 12px; color: var(--muted); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--outline); vertical-align: middle; }
th { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; background: #FAFBFE; }
.table-wrap { overflow-x: auto; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 12px; text-align: center; color: var(--muted); }
.empty .i { width: 32px; height: 32px; }

/* Authentification */
.auth { min-height: calc(100vh - 41px); display: grid; grid-template-columns: 1.1fr 1fr; }
.auth-side { background: linear-gradient(150deg, #1E4FB8, #143A8C); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.auth-side h1 { font-size: 34px; font-weight: 700; }
.auth-side p { font-size: 16px; opacity: .9; max-width: 440px; }
.auth-side ul { margin: 0; padding-left: 18px; opacity: .92; display: flex; flex-direction: column; gap: 6px; }
.auth-form { display: grid; place-items: center; padding: 32px 16px; }
.auth-card { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }
.auth-card h2 { font-size: 24px; font-weight: 500; }
.linkbtn { border: 0; background: none; color: var(--primary); font-weight: 500; padding: 0; }

/* Accueil */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.stat { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.stat-ico { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; }
.stat b { display: block; font-size: 24px; font-weight: 500; }
.stat span { font-size: 12px; color: var(--muted); }
.list { display: flex; flex-direction: column; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--outline); }
.list-item:last-child { border-bottom: 0; }
.list-item .t { flex: 1; min-width: 0; }
.list-item .t b { font-weight: 500; display: block; }
.ico-box { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); flex: none; }
.clickable { cursor: pointer; border-radius: 8px; }
.clickable:hover { background: var(--surface-variant); }

/* Espace */
.esp-head { display: flex; align-items: flex-start; gap: 14px; }
.esp-head .ico-box { width: 52px; height: 52px; }
.esp-head h1 { font-size: 22px; font-weight: 500; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--outline); overflow-x: auto; }
.tab { border: 0; background: none; padding: 12px 16px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
.chat { display: flex; flex-direction: column; height: 560px; }
.chat-list { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.day { align-self: center; font-size: 12px; color: var(--muted); background: var(--surface-variant); padding: 2px 10px; border-radius: 999px; }
.msg { display: flex; gap: 10px; }
.msg-body { flex: 1; min-width: 0; }
.msg-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.msg-meta b { color: var(--on-surface); font-size: 14px; font-weight: 500; }
.msg-text { margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.pj { display: inline-flex; align-items: center; gap: 10px; margin-top: 8px; padding: 8px 12px; border: 1px solid var(--outline); border-radius: 10px; background: #FAFBFE; }
.pj small { color: var(--muted); }
.composer { border-top: 1px solid var(--outline); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.composer-row { display: flex; gap: 8px; align-items: center; }
.composer-row .input { flex: 1; }
.annonce { padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; }
.chapitre { border: 1px solid var(--outline); border-radius: 10px; overflow: hidden; }
.chapitre summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 10px; font-weight: 500; background: #FAFBFE; }
.chapitre summary::-webkit-details-marker { display: none; }
.chapitre[open] summary .chev { transform: rotate(90deg); }
.chapitre .ress { padding: 4px 16px 8px; }
.ress-item.hl { background: var(--warning-soft); }
.ia { display: grid; grid-template-columns: 1fr 300px; gap: 16px; }
.ia-chat { display: flex; flex-direction: column; height: 600px; }
.bulle-q { align-self: flex-end; max-width: 80%; background: var(--primary); color: #fff; padding: 10px 14px; border-radius: 14px 14px 4px 14px; }
.bulle-r { display: flex; gap: 10px; max-width: 92%; }
.bulle-r .contenu { background: var(--surface-variant); padding: 12px 14px; border-radius: 14px 14px 14px 4px; display: flex; flex-direction: column; gap: 8px; }
.bulle-r ul { margin: 0; padding-left: 18px; }
.citation { border: 0; background: none; padding: 0 2px; border-radius: 4px; color: var(--primary); font-weight: 700; }
.citation.active, .citation:hover { background: var(--primary-soft); }
.sources { display: flex; flex-wrap: wrap; gap: 6px; }
.source { cursor: pointer; background: var(--surface); border-color: var(--outline); }
.source.active { background: var(--primary); color: #fff; }
.chip.source { height: auto; min-height: 32px; padding: 6px 10px; text-align: left; white-space: normal; }
.avis { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.avis button { border: 1px solid var(--outline); background: var(--surface); border-radius: 8px; padding: 2px 8px; }
.avis button[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); }
.ia-dot { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #1E4FB8, #00796B); color: #fff; flex: none; }
.switch { position: relative; width: 44px; height: 24px; border-radius: 12px; border: 0; background: #C3CADA; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch[aria-checked="true"] { background: var(--primary); }
.switch[aria-checked="true"]::after { left: 23px; }

/* Assistant de création */
.stepper { display: flex; gap: 6px; }
.step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); text-align: center; }
.step .n { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--surface-variant); font-weight: 700; }
.step.on { color: var(--primary); font-weight: 500; }
.step.on .n, .step.done .n { background: var(--primary); color: #fff; }
.choice { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--outline); border-radius: 10px; cursor: pointer; }
.choice input { margin-top: 3px; }
.choice.sel { border-color: var(--primary); background: var(--primary-soft); }
.choice.off { opacity: .55; cursor: not-allowed; }

/* Fenêtres */
.overlay { position: fixed; inset: 0; z-index: 80; background: rgba(28,35,51,.45); display: grid; place-items: center; padding: 16px; }
.dialog { width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.dialog h2 { font-size: 20px; font-weight: 500; }
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 90; background: #1C2333; color: #fff; padding: 12px 18px; border-radius: 8px; box-shadow: var(--shadow); }
.scope-col h3 { font-size: 14px; font-weight: 500; margin-bottom: 6px; }
.scope-col ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }

/* Responsive : tablette */
@media (max-width: 960px) {
  .app { grid-template-columns: 1fr; }
  .drawer { position: fixed; top: 105px; bottom: 0; left: 0; width: 288px; z-index: 60; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  .drawer.open { transform: none; }
  .menu-btn { display: grid; }
  .user-text, .search { display: none; }
  .ia { grid-template-columns: 1fr; }
  .ia-side { display: none; }
  .stats, .grid-3 { grid-template-columns: 1fr; }
  .auth { grid-template-columns: 1fr; }
  .auth-side { display: none; }
}
/* Responsive : téléphone */
@media (max-width: 600px) {
  .main { padding: 16px 16px 88px; }
  .grid-2 { grid-template-columns: 1fr; }
  .bottom-nav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 55; height: 64px; background: var(--surface); border-top: 1px solid var(--outline); }
  .bottom-nav button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--muted); }
  .bottom-nav button[aria-current="page"] { color: var(--primary); font-weight: 500; }
  .chat, .ia-chat { height: calc(100vh - 330px); min-height: 380px; }
  .strip .hide-xs { display: none; }
  .dialog { max-width: none; max-height: none; height: 100%; border-radius: 0; }
  .overlay { padding: 0; }
  .step span { display: none; }
}
</style>
</head>

    return l.length ? `<div class="nav-title">${titre}</div>${l.map(esp).join('')}` : ''
  }
  let html = ''
  if (user().droits.includes('CREER_GROUPE_PRIVE') && S.role !== 'admin') {
    html += `<button class="btn primary block" type="button" data-act="wizard">${ico('plus')}Créer un espace</button>`
  }
  html += `<div style="margin-top:8px">${item('accueil', 'home', 'Accueil')}${item('notifications', 'bell', 'Notifications', nonLues())}</div>`
  if (S.role === 'admin') {
    html += `<div class="nav-title">Administration</div>
      ${item('annees', 'calendar', 'Années universitaires')}${item('referentiels', 'folder', 'Référentiels')}
      ${item('comptes', 'account', 'Comptes autorisés')}${item('groupes', 'group', 'Groupes organisationnels')}`
  } else {
    html += rub('Mes classes et matières', 'ORGANISATIONNEL') + rub('Mes groupes privés', 'PRIVE')
  }
  return `<nav class="drawer ${S.drawer ? 'open' : ''}" aria-label="Menu principal">${html}</nav>`
}

function bottomNav() {
  const b = (vue, icone, l) => `<button type="button" data-act="go" data-a="${vue}" ${S.vue === vue ? 'aria-current="page"' : ''}>${ico(icone)}<span>${l}</span></button>`
  return `<nav class="bottom-nav" aria-label="Navigation">${b('accueil', 'home', 'Accueil')}${S.role === 'admin' ? b('comptes', 'account', 'Comptes') : `<button type="button" data-act="drawer">${ico('group')}<span>Espaces</span></button>`}${b('notifications', 'bell', 'Notifs')}</nav>`
}

/* ------------------------------------------------------------------ accueil (E04) */
function accueil() {
  const u = user()
  const date = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(2026, 10, 19))
  const esp = espacesVisibles()
  const totalNonLus = esp.reduce((t, e) => t + e.nonLus, 0)
  const stat = (v, l, icone, bg, fg) => `<div class="card stat"><span class="stat-ico" style="background:${bg};color:${fg}">${ico(icone)}</span><div><b>${v}</b><span>${l}</span></div></div>`
  const invs = invitations()
  if (S.role === 'admin') {
    return `<div class="page"><div class="page-head"><div><h1>Bonjour ${esc(u.prenom)}</h1><p class="muted date-cap">${date}</p></div></div>
      <div class="stats">${stat('2026/2027', 'année active', 'calendar', '#E3EBFB', '#1E4FB8')}${stat(D.comptes.length, 'comptes autorisés', 'account', '#DDF2EF', '#00695C')}${stat(S.groupesGeneres ? 12 : 0, 'groupes organisationnels', 'group', '#FEF3DC', '#8A4100')}</div>
      <div class="card card-pad"><h2>${ico('shield')}Paramétrage de l'année</h2>
        <div class="list" style="margin-top:8px">
        ${[['annees', 'calendar', 'Années universitaires', 'Une seule année active à la fois'], ['referentiels', 'folder', 'Référentiels', 'Départements, filières, niveaux, classes, matières'], ['comptes', 'account', 'Comptes autorisés', 'Liste des personnes qui peuvent créer un compte, import Excel'], ['groupes', 'group', 'Groupes organisationnels', 'Un groupe par classe et par matière']].map(([v, i, t, d]) => `<div class="list-item clickable" data-act="go" data-a="${v}"><span class="ico-box">${ico(i)}</span><div class="t"><b>${t}</b><span class="muted small">${d}</span></div>${ico('chevron')}</div>`).join('')}
        </div></div></div>`
  }
  return `<div class="page">
    <div class="page-head"><div><h1>Bonjour ${esc(u.prenom)}</h1><p class="muted date-cap">${date}</p></div></div>
    <div class="stats">${stat(totalNonLus, totalNonLus > 1 ? 'messages non lus' : 'message non lu', 'send', '#E3EBFB', '#1E4FB8')}${stat(invs.length, invs.length > 1 ? 'invitations en attente' : 'invitation en attente', 'group', '#DDF2EF', '#00695C')}${stat(esp.length, 'espaces', 'list', '#FEF3DC', '#8A4100')}</div>
    <div class="card card-pad"><h2>${ico('bullhorn')}Dernières annonces</h2>
      <div class="list" style="margin-top:8px">${D.annonces[2].map((a) => `<div class="list-item clickable" data-act="espace" data-a="2" data-o="annonces"><span class="ico-box">${ico('bullhorn')}</span><div class="t"><b>${esc(a.titre)}</b><span class="muted small">Bases de données · ${esc(a.auteur)} · ${a.date}</span></div>${ico('chevron')}</div>`).join('')}</div></div>
    <div class="card card-pad"><h2>${ico('group')}Invitations</h2>
      ${invs.length ? `<div class="list" style="margin-top:8px">${invs.map((i) => `<div class="list-item"><span class="ico-box">${ico('lock')}</span><div class="t"><b>${esc(i.espace)}</b><span class="muted small">Invité par ${esc(i.par)} · expire le ${i.expire}</span></div><button class="btn text sm" type="button" data-act="refuser" data-a="${i.id}">Refuser</button><button class="btn primary sm" type="button" data-act="accepter" data-a="${i.id}">Accepter</button></div>`).join('')}</div>`
        : `<div class="empty">${ico('check')}<p>Aucune invitation en attente.</p></div>`}</div>
    <div class="card card-pad"><h2>${ico('list')}Mes espaces</h2>
      <div class="list" style="margin-top:8px">${esp.map((e) => `<div class="list-item clickable" data-act="espace" data-a="${e.id}"><span class="ico-box">${ico(e.icone)}</span><div class="t"><b>${esc(e.nom)}</b><span class="muted small">${e.membres} membres · ${LIB_ROLE[role(e)]}</span></div>${e.nonLus ? `<span class="chip primary">${e.nonLus} non lu${e.nonLus > 1 ? 's' : ''}</span>` : ''}</div>`).join('')}</div></div>
  </div>`
}

/* ------------------------------------------------------------------ notifications (E09) */
function notifications() {
  const invs = invitations()
  return `<div class="page"><div class="page-head"><div><h1>Notifications</h1></div><button class="btn text" type="button" data-act="toutlire">Tout marquer comme lu</button></div>
    <div class="card card-pad"><h2>Invitations</h2>
      ${invs.length ? `<div class="list" style="margin-top:8px">${invs.map((i) => `<div class="list-item"><span class="ico-box">${ico('lock')}</span><div class="t"><b>${esc(i.espace)}</b><span class="muted small">Invité par ${esc(i.par)}</span></div><button class="btn text sm" type="button" data-act="refuser" data-a="${i.id}">Refuser</button><button class="btn primary sm" type="button" data-act="accepter" data-a="${i.id}">Accepter</button></div>`).join('')}</div>` : `<div class="empty"><p>Aucune invitation en attente.</p></div>`}
    </div>

      ${D.notifications.map((n) => `<div class="list-item clickable" data-act="lire" data-a="${n.id}"><span style="width:8px;height:8px;border-radius:50%;background:${n.lue ? 'transparent' : 'var(--primary)'}"></span><div class="t"><span style="${n.lue ? '' : 'font-weight:500'}">${esc(n.texte)}</span><br><span class="muted small">${n.quand}</span></div></div>`).join('')}
    </div></div></div>`
}

/* ------------------------------------------------------------------ espace (E05 à E07) */
function espace() {
  const e = D.espaces.find((x) => x.id === S.espaceId)
  const onglets = [['discussion', 'Discussion'], ['annonces', 'Annonces'], ['ressources', 'Ressources'], ['membres', 'Membres']]
  if (S.assistantActif[e.id]) onglets.push(['assistant', 'Assistant IA'])
  if (estGestionnaire(e)) onglets.push(['parametres', 'Paramètres'])
  if (!onglets.some(([k]) => k === S.onglet)) S.onglet = 'discussion'
  const contenu = { discussion, annonces, ressources, membres, assistant, parametres }[S.onglet](e)
  return `<div class="page">
    <div class="esp-head"><span class="ico-box">${ico(e.icone, 'width:28px;height:28px')}</span>
      <div style="flex:1;min-width:0"><h1>${esc(e.nom)}</h1>
        <div class="row" style="margin-top:6px"><span class="chip primary">${e.type === 'PRIVE' ? 'Groupe privé' : e.icone === 'school' ? 'Groupe de classe' : 'Matière'}</span><span class="chip warning">Messages visibles ${e.visibilite}</span><span class="muted small">${e.membres} membres · ${LIB_ROLE[role(e)]}</span></div>
      </div></div>
    <div class="tabs" role="tablist">${onglets.map(([k, l]) => `<button class="tab" role="tab" type="button" data-act="onglet" data-a="${k}" aria-selected="${S.onglet === k}">${k === 'assistant' ? ico('spark', 'width:18px;height:18px') : ''}${l}</button>`).join('')}</div>
    ${contenu}
  </div>`
}

function discussion(e) {
  const msgs = D.messages[e.id] || []
  let jour = null
  const lignes = msgs.map((m) => {
    const sep = m.jour !== jour ? `<span class="day">${m.jour}</span>` : ''
    jour = m.jour
    return `${sep}<div class="msg"><span class="avatar sm" style="${m.badge ? 'background:var(--secondary)' : ''}">${m.initiales}</span><div class="msg-body">
      <div class="msg-meta"><b>${esc(m.auteur)}</b>${m.badge ? `<span class="chip secondary">${m.badge}</span>` : ''}<span>${m.heure}</span></div>
      <p class="msg-text">${esc(m.texte)}</p>
      ${m.pj ? `<button class="pj" type="button" data-act="toast" data-a="Téléchargement protégé : réservé aux membres de l'espace.">${ico('file')}<span>${esc(m.pj.nom)} <small>· ${m.pj.taille}</small></span>${ico('download')}</button>` : ''}
    </div></div>`
  }).join('')
  return `<div class="card chat">
    <div class="chat-list" id="chat">${lignes || `<div class="empty">${ico('send')}<p><b>Aucun message pour l'instant.</b><br>Soyez le premier à lancer la discussion.</p></div>`}</div>
    <form class="composer" data-submit="message">
      ${S.pj ? `<div class="row"><span class="chip outlined">${ico('file', 'width:16px;height:16px')}${esc(S.pj)}<button type="button" class="linkbtn" data-act="pjx" aria-label="Retirer la pièce jointe">${ico('close', 'width:14px;height:14px')}</button></span></div>` : ''}
      <div class="composer-row">
        <button class="icon-btn" type="button" data-act="pj" aria-label="Joindre un fichier">${ico('clip')}</button>
        <input class="input" name="texte" placeholder="Écrire un message à ${esc(e.nom)}…" aria-label="Message" autocomplete="off">
        <button class="btn primary" type="submit">${ico('send')}<span class="hide-xs">Envoyer</span></button>
      </div>
      <span class="hint">Les messages de cet espace sont supprimés définitivement ${e.visibilite} après leur envoi. Fichiers : 10 Mo maximum, visibles uniquement par les membres.</span>
    </form></div>`
}

function annonces(e) {
  const l = D.annonces[e.id] || []
  return `${estGestionnaire(e) ? `<div class="row"><span class="spacer"></span><button class="btn primary" type="button" data-act="dialog" data-a="annonce">${ico('plus')}Publier une annonce</button></div>` : ''}
    ${l.length ? l.map((a) => `<div class="card annonce"><div class="row"><span class="chip warning">${ico('bullhorn', 'width:14px;height:14px')}Annonce</span><span class="muted small">${esc(a.auteur)} · ${a.date}</span></div><h2 style="font-size:18px;font-weight:500">${esc(a.titre)}</h2><p>${esc(a.texte)}</p></div>`).join('')
      : `<div class="card"><div class="empty">${ico('bullhorn')}<p>Aucune annonce pour l'instant.</p></div></div>`}`
}

function ressources(e) {
  const chaps = D.chapitres[e.id] || []
  const ens = estGestionnaire(e)
  return `<div class="row">${ens ? `<button class="btn outlined" type="button" data-act="toast" data-a="Nouveau chapitre ajouté (démo).">${ico('plus')}Nouveau chapitre</button><button class="btn primary" type="button" data-act="dialog" data-a="ressource">${ico('upload')}Ajouter une ressource</button>` : ''}</div>
    ${chaps.length ? chaps.map((c, i) => `<details class="chapitre" ${i === 2 || S.hl ? 'open' : ''}><summary><span class="chev">${ico('chevron')}</span>${esc(c.titre)}<span class="spacer"></span><span class="muted small">${c.ress.length} ressource${c.ress.length > 1 ? 's' : ''}</span></summary>
      <div class="ress list">${c.ress.map((r) => `<div class="list-item ress-item ${S.hl === r.id ? 'hl' : ''}"><span class="ico-box">${ico(r.taille === 'Lien' ? 'compass' : 'file')}</span><div class="t"><b>${esc(r.nom)}</b><span class="muted small">${r.taille}</span></div>${ens && r.indexee ? '<span class="chip success">Indexée pour l\'IA</span>' : ''}<button class="icon-btn" type="button" data-act="toast" data-a="Téléchargement protégé : réservé aux membres de l'espace." aria-label="Télécharger">${ico('download')}</button></div>`).join('')}</div></details>`).join('')
      : `<div class="card"><div class="empty">${ico('folder')}<p>Aucune ressource publiée.</p></div></div>`}`
}

function membres(e) {
  const gest = estGestionnaire(e)
  const u = user()
  const moi = { nom: `${u.prenom} ${u.nom}`, initiales: initiales(u), profil: u.profil, role: role(e) || 'MEMBRE', depuis: e.id > 4 ? "aujourd'hui" : '5 nov. 2026' }
  const autres = D.membres.filter((m) => m.nom !== moi.nom)
  let l = D.membres
  if (e.type === 'PRIVE') {
    // Groupe privé : le créateur est propriétaire, les autres sont des membres invités.
    l = moi.role === 'PROPRIETAIRE'
      ? [moi, ...autres.filter((m) => m.role !== 'PROPRIETAIRE').map((m) => ({ ...m, role: 'MEMBRE' }))]
      : [autres[0], moi, ...autres.slice(1).map((m) => ({ ...m, role: 'MEMBRE' }))]
    l = l.slice(0, e.membres)
  }
  return `<div class="card"><div class="row card-pad" style="padding-bottom:0"><h2>${e.membres} membres</h2><span class="spacer"></span>${gest ? `<button class="btn primary" type="button" data-act="dialog" data-a="inviter">${ico('plus')}Inviter</button>` : ''}</div>
    <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Membre</th><th>Profil</th><th>Rôle</th><th>Depuis</th>${gest ? '<th></th>' : ''}</tr></thead><tbody>
    ${l.map((m) => `<tr><td><div class="row"><span class="avatar sm">${m.initiales}</span>${esc(m.nom)}</div></td><td>${m.profil}</td><td><span class="chip ${m.role === 'PROPRIETAIRE' ? 'primary' : m.role === 'CO_GESTIONNAIRE' ? 'secondary' : ''}">${LIB_ROLE[m.role]}</span></td><td class="muted">${m.depuis}</td>
      ${gest ? `<td>${m.role === 'MEMBRE' ? `<button class="btn text sm" type="button" data-act="toast" data-a="${esc(m.nom)} est maintenant co-gestionnaire.">Nommer co-gestionnaire</button><button class="btn danger sm" type="button" data-act="toast" data-a="${esc(m.nom)} a été retiré : son accès aux messages et fichiers est coupé immédiatement.">Retirer</button>` : ''}</td>` : ''}</tr>`).join('')}
    </tbody></table></div>
    <div class="card-pad">${e.type === 'ORGANISATIONNEL' ? '<p class="muted small">Groupe de classe ou de matière : les membres sont rattachés automatiquement, on ne peut pas le quitter.</p>' : `<button class="btn danger" type="button" data-act="toast" data-a="Vous avez quitté l'espace (démo).">Quitter l'espace</button>`}</div></div>`
}

/* Assistant IA : réponses de démonstration, avec citations [n] et sources */
const QR = {
  q: "Quels sont les attributs d'un curseur explicite ?",
  r: [
    'Un curseur explicite possède quatre attributs [1] :',
    '- **%FOUND** : vrai si le dernier FETCH a ramené une ligne [1]',
    '- **%NOTFOUND** : l\'inverse de %FOUND, utile pour sortir d\'une boucle [1]',
    '- **%ISOPEN** : vrai si le curseur est ouvert [2]',
    '- **%ROWCOUNT** : nombre de lignes lues jusqu\'ici [2]',
  ],
  sources: [{ n: 1, fichier: 'Chapitre 3 – Curseurs PL/SQL.pdf', page: 4, id: 14 }, { n: 2, fichier: 'Chapitre 3 – Curseurs PL/SQL.pdf', page: 5, id: 14 }],
}
function formaterLigne(l, idx) {
  return esc(l).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\[(\d+)\]/g, (m, n) => `<button type="button" class="citation ${S.sourceActive[idx] === +n ? 'active' : ''}" data-act="cite" data-a="${idx}" data-n="${n}">[${n}]</button>`)
}
function assistant(e) {
  const echanges = S.ia.map((x, idx) => {
    if (x.sansSource) {
      return `<div class="bulle-q">${esc(x.q)}</div><div class="bulle-r"><span class="ia-dot">${ico('spark', 'width:18px;height:18px')}</span><div class="contenu"><div class="alert warning">${ico('info')}Je n'ai pas trouvé de réponse fiable dans les ressources de cet espace. Essayez de reformuler, ou demandez à votre enseignant.</div></div></div>`
    }
    const puces = x.r.filter((l) => l.startsWith('- ')).map((l) => `<li>${formaterLigne(l.slice(2), idx)}</li>`).join('')
    const texte = x.r.filter((l) => !l.startsWith('- ')).map((l) => `<p>${formaterLigne(l, idx)}</p>`).join('')
    return `<div class="bulle-q">${esc(x.q)}</div>
      <div class="bulle-r"><span class="ia-dot">${ico('spark', 'width:18px;height:18px')}</span><div class="contenu">${texte}<ul>${puces}</ul>
        <div class="sources">${x.sources.map((s) => `<button type="button" class="chip outlined source ${S.sourceActive[idx] === s.n ? 'active' : ''}" data-act="source" data-a="${s.id}">${ico('file', 'width:16px;height:16px')}<b>[${s.n}]</b> ${esc(s.fichier)} · p. ${s.page}</button>`).join('')}</div>
        <div class="avis"><span>Réponse générée par IA, à vérifier dans les sources.</span><span class="spacer"></span><button type="button" data-act="avis" data-a="${idx}" data-v="1" aria-pressed="${x.avis === 1}" aria-label="Réponse utile">👍</button><button type="button" data-act="avis" data-a="${idx}" data-v="0" aria-pressed="${x.avis === 0}" aria-label="Réponse pas utile">👎</button></div>
      </div></div>`
  }).join('')
  const vide = !S.ia.length
  return `<div class="ia">
    <div class="card ia-chat">
      <div class="row card-pad" style="padding:14px 16px;border-bottom:1px solid var(--outline)"><span class="ia-dot">${ico('spark', 'width:18px;height:18px')}</span><div style="flex:1"><b>Assistant du cours</b><br><span class="muted small">Répond à partir des ressources publiées dans cet espace, en citant ses sources.</span></div><button class="btn text sm" type="button" data-act="nouvelle">Nouvelle conversation</button></div>
      <div class="chat-list" id="chat">
        ${vide ? `<div class="bulle-r"><span class="ia-dot">${ico('spark', 'width:18px;height:18px')}</span><div class="contenu">Bonjour ${esc(user().prenom)}. Je réponds à vos questions à partir des supports publiés dans cet espace, en citant mes sources.</div></div>
          <div class="sources" style="padding-left:42px">${[QR.q, 'Résume les notions clés du chapitre 3', 'Quelle est la capitale de l\'Australie ?'].map((s) => `<button class="chip outlined btnchip" type="button" data-act="poser" data-a="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : echanges}
      </div>
      <form class="composer" data-submit="question">
        <div class="composer-row"><input class="input" name="q" placeholder="Posez une question sur le cours…" aria-label="Question" ${S.quota ? '' : 'disabled'}><button class="btn primary" type="submit" ${S.quota ? '' : 'disabled'}>${ico('send')}</button></div>
        <span class="hint">${S.quota ? `Questions restantes aujourd'hui : ${S.quota} sur 20 (tous espaces confondus). Vos questions sont privées.` : 'Vous avez atteint vos 20 questions du jour. Revenez demain.'}</span>
      </form>
    </div>
    <aside class="card card-pad ia-side"><h2 style="font-size:16px">${ico('folder')}Sources de l'assistant</h2><p class="muted small" style="margin:6px 0 10px">Documents indexés de l'espace</p>
      <div class="list">${D.chapitres[2].flatMap((c) => c.ress.filter((r) => r.indexee)).map((r) => `<div class="list-item">${ico('file')}<span class="small">${esc(r.nom)}</span></div>`).join('')}</div></aside>
  </div>`
}

function parametres(e) {
  const actif = !!S.assistantActif[e.id]
  return `<div class="grid-2">
    <div class="card card-pad"><h2>${ico('cog')}Informations</h2>
      <div class="field" style="margin-top:12px"><label for="pn">Nom</label><input id="pn" class="input" value="${esc(e.nom)}"></div>
      <div class="field" style="margin-top:12px"><label for="pv">Visibilité des messages</label><select id="pv" class="input"><option>24 heures</option><option>7 jours</option><option selected>30 jours</option></select><span class="hint">S'applique aux nouveaux messages uniquement.</span></div>

    <div class="card card-pad"><h2>${ico('spark')}Assistant IA</h2>
      <div class="row" style="margin-top:12px"><div style="flex:1"><b style="font-weight:500">Activer l'assistant pour cet espace</b><br><span class="muted small">Les étudiants posent leurs questions ; l'IA répond à partir des PDF indexés.</span></div>
        <button class="switch" type="button" role="switch" aria-checked="${actif}" aria-label="Activer l'Assistant IA" data-act="assistant"></button></div>
      <div class="field" style="margin-top:14px"><label for="pc">Consigne pour l'assistant (facultatif)</label><textarea id="pc" class="input" placeholder="Ex. : Donne des exemples SQL quand c'est possible.">Donne des exemples SQL quand c'est possible.</textarea></div>
      <p class="hint" style="margin-top:8px">Quota : 20 questions par étudiant et par jour. Fournisseurs : Gemini, puis Groq en secours.</p></div>
  </div>`
}

/* ------------------------------------------------------------------ créer un espace (E06) */
function wizard() {
  const w = S.wizard
  const etapes = ['Type', 'Informations', 'Visibilité', 'Invitations', 'Récapitulatif']
  const corps = [
    `<div class="choice sel"><input type="radio" checked aria-label="Groupe privé"><div><b style="font-weight:500">Groupe privé</b><br><span class="muted small">Sur invitation, pour un projet ou des révisions.</span></div></div>
     <div class="choice off"><input type="radio" disabled aria-label="Channel"><div><b style="font-weight:500">Channel</b> <span class="chip">v1.1</span><br><span class="muted small">Espace thématique ouvert (club, vie étudiante).</span></div></div>`,
    `<div class="field"><label for="wn">Nom de l'espace</label><input id="wn" class="input" data-w="nom" value="${esc(w.nom)}" placeholder="Ex. : Révisions BD"><span class="hint">3 à 80 caractères.</span></div>
     <div class="field"><label for="wd">Description (facultatif)</label><textarea id="wd" class="input" data-w="desc">${esc(w.desc)}</textarea></div>`,
    ['24 heures', '7 jours', '30 jours'].map((d) => `<label class="choice ${w.duree === d ? 'sel' : ''}"><input type="radio" name="duree" data-w="duree" value="${d}" ${w.duree === d ? 'checked' : ''}><div><b style="font-weight:500">${d}</b><br><span class="muted small">Les messages sont supprimés ${d} après leur envoi.</span></div></label>`).join(''),
    `<div class="field"><label for="wi">Rechercher par nom ou prénom</label><input id="wi" class="input" placeholder="Tapez au moins 2 lettres…" value="Ben"></div>
     <div class="list">${['Nour Ben Ali · Étudiant · L2 Info – Groupe A', 'Yasmine Trabelsi · Étudiant · L2 Info – Groupe A'].map((p, i) => `<label class="list-item clickable"><input type="checkbox" data-w="inv${i}" ${w['inv' + i] ? 'checked' : ''}><span class="avatar sm">${p.split(' ').map((x) => x[0]).slice(0, 2).join('')}</span><span>${p}</span></label>`).join('')}</div>
     <p class="hint">Facultatif : vous pourrez inviter d'autres personnes depuis l'onglet Membres.</p>`,
    `<div class="list"><div class="list-item"><b style="width:140px;font-weight:500">Type</b>Groupe privé</div><div class="list-item"><b style="width:140px;font-weight:500">Nom</b>${esc(w.nom || '—')}</div><div class="list-item"><b style="width:140px;font-weight:500">Visibilité</b>${w.duree}</div><div class="list-item"><b style="width:140px;font-weight:500">Invitations</b>${[w.inv0 && 'Nour Ben Ali', w.inv1 && 'Yasmine Trabelsi'].filter(Boolean).join(', ') || 'Aucune'}</div></div>`,
  ]
  const peutContinuer = w.etape !== 1 || w.nom.trim().length >= 3
  return `<div class="page" style="max-width:820px"><div class="page-head"><div><h1>Créer un espace</h1></div><button class="btn text" type="button" data-act="go" data-a="accueil">Annuler</button></div>
    <div class="card card-pad" style="display:flex;flex-direction:column;gap:18px">
      <div class="stepper">${etapes.map((t, i) => `<div class="step ${i === w.etape ? 'on' : i < w.etape ? 'done' : ''}"><span class="n">${i < w.etape ? '✓' : i + 1}</span><span>${t}</span></div>`).join('')}</div>
      <div style="display:flex;flex-direction:column;gap:12px">${corps[w.etape]}</div>
      <div class="row"><button class="btn text" type="button" data-act="wprev" ${w.etape ? '' : 'disabled'}>Retour</button><span class="spacer"></span>
        ${w.etape < 4 ? `<button class="btn primary" type="button" data-act="wnext" ${peutContinuer ? '' : 'disabled'}>Continuer</button>` : `<button class="btn primary" type="button" data-act="wcreer">Créer l'espace</button>`}</div>
    </div></div>`
}

/* ------------------------------------------------------------------ administration (A01, A02, A03, A06) */
function annees() {
  return `<div class="page"><div class="page-head"><div><h1>Années universitaires</h1><p class="muted">Une seule année active à la fois : elle sert à rattacher les comptes et à générer les groupes.</p></div><button class="btn primary" type="button" data-act="toast" data-a="Année créée (démo).">${ico('plus')}Nouvelle année</button></div>
    <div class="card table-wrap"><table><thead><tr><th>Année</th><th>Début</th><th>Fin</th><th>État</th><th></th></tr></thead><tbody>
    ${D.annees.map((a, i) => `<tr><td><b style="font-weight:500">${a.libelle}</b></td><td>${a.debut}</td><td>${a.fin}</td><td>${a.active ? '<span class="chip success">Active</span>' : '<span class="chip">Préparée</span>'}</td><td>${a.active ? '' : `<button class="btn outlined sm" type="button" data-act="activer" data-a="${i}">Activer</button>`}</td></tr>`).join('')}
    </tbody></table></div></div>`
}
function referentiels() {
  const t = S.refOnglet || 'Classes'
  return `<div class="page"><div class="page-head"><div><h1>Référentiels</h1><p class="muted">Un élément utilisé ne peut pas être supprimé : il est désactivé.</p></div><button class="btn primary" type="button" data-act="toast" data-a="Élément ajouté (démo).">${ico('plus')}Ajouter</button></div>
    <div class="tabs">${Object.keys(D.referentiels).map((k) => `<button class="tab" type="button" data-act="ref" data-a="${k}" aria-selected="${t === k}">${k}</button>`).join('')}</div>
    <div class="card table-wrap"><table><thead><tr><th>Code</th><th>Libellé</th><th>État</th></tr></thead><tbody>${D.referentiels[t].map(([c, l]) => `<tr><td><b style="font-weight:500">${c}</b></td><td>${l}</td><td><span class="chip success">Actif</span></td></tr>`).join('')}</tbody></table></div></div>`
}
function comptes() {
  return `<div class="page"><div class="page-head"><div><h1>Comptes autorisés</h1><p class="muted">Personnes qui peuvent créer un compte (année 2026/2027).</p></div>
      <button class="btn outlined" type="button" data-act="toast" data-a="Modèle Excel téléchargé.">${ico('download')}Modèle Excel</button><button class="btn primary" type="button" data-act="dialog" data-a="import">${ico('upload')}Importer un fichier Excel</button></div>
    <div class="card table-wrap"><table><thead><tr><th>Matricule</th><th>Nom</th><th>E-mail</th><th>Profil</th><th>Classe</th><th>État</th></tr></thead><tbody>
    ${D.comptes.map((c) => `<tr><td>${c.matricule}</td><td>${esc(c.nom)}</td><td class="muted">${c.email}</td><td>${c.profil}</td><td>${c.classe}</td><td><span class="chip ${c.etat === 'Actif' ? 'success' : ''}">${c.etat}</span></td></tr>`).join('')}
    </tbody></table></div></div>`
}
function groupes() {
  const g = [['L2 Info – Groupe A', 'Classe', 32], ['L2 Info – Groupe A · Bases de données', 'Matière', 33], ['L2 Info – Groupe A · Développement Web', 'Matière', 33], ['L2 Info – Groupe B', 'Classe', 30]]
  return `<div class="page"><div class="page-head"><div><h1>Groupes organisationnels</h1><p class="muted">Un groupe par classe et un par matière de l'année active. On peut relancer la génération sans créer de doublons.</p></div>
      <button class="btn primary" type="button" data-act="dialog" data-a="generer">${ico('group')}Générer les groupes</button></div>
    ${S.groupesGeneres ? `<div class="card table-wrap"><table><thead><tr><th>Groupe</th><th>Type</th><th>Membres</th><th></th></tr></thead><tbody>${g.map(([n, t, m]) => `<tr><td>${n}</td><td><span class="chip ${t === 'Classe' ? 'primary' : 'secondary'}">${t}</span></td><td>${m}</td><td><button class="btn text sm" type="button" data-act="toast" data-a="Membres synchronisés avec les comptes de la classe.">Synchroniser</button></td></tr>`).join('')}</tbody></table></div>`
      : `<div class="card"><div class="empty">${ico('group')}<p>Aucun groupe pour l'année 2026/2027.<br>Cliquez sur « Générer les groupes » : un aperçu s'affiche avant toute création.</p></div></div>`}</div>`
}

/* ------------------------------------------------------------------ fenêtres */
function dialog() {
  if (!S.dialog) return ''
  const d = {
    perimetre: `<h2>Périmètre de la version 1.0 (19/11/2026)</h2>
      <div class="grid-2">
        <div class="scope-col"><h3>✅ Livré (sprints S0 à S2)</h3><ul><li>Inscription contrôlée, activation, connexion</li><li>Accueil : mes espaces, non-lus, invitations</li><li>Groupes de classe et de matières automatiques</li><li>Groupes privés, invitations, membres et rôles</li><li>Discussion, pièces jointes protégées</li><li>Annonces, ressources par chapitre</li><li>Notifications dans l'application</li><li>Assistant IA : réponses sourcées, avis, quota de 20/jour</li><li>Administration : années, référentiels, comptes autorisés et import Excel, génération des groupes</li><li>Responsive (téléphone) et accessibilité</li></ul></div>
        <div class="scope-col"><h3>🕓 Prévu en v1.1</h3><ul><li>Mot de passe oublié</li><li>Annuaire des channels</li><li>Épinglés, onglet Fichiers</li><li>Signalement et modération</li><li>Utilisateurs et droits, historique</li><li>Tableau de bord, recherche</li><li>Résumé IA de la discussion</li><li>Purge automatique, profil</li></ul></div>
      </div><p class="hint">Sources : Jira (sprints S0, S1, S2 ; stories étiquetées v1.1). Données de démonstration fictives.</p>
      <div class="actions"><button class="btn primary" type="button" data-act="close">Fermer</button></div>`,
    annonce: `<h2>Publier une annonce</h2><div class="field"><label for="at">Titre</label><input id="at" class="input" value="Rappel : rendu du projet"></div><div class="field"><label for="ax">Texte</label><textarea id="ax" class="input">Le rendu du mini-projet est fixé au 30/11 à 23 h 59 sur la plateforme.</textarea></div><p class="hint">Les membres de l'espace reçoivent une notification.</p><div class="actions"><button class="btn text" type="button" data-act="close">Annuler</button><button class="btn primary" type="button" data-act="publier">Publier</button></div>`,
    ressource: `<h2>Ajouter une ressource</h2><div class="field"><label for="rt">Titre</label><input id="rt" class="input" value="Chapitre 4 – Déclencheurs.pdf"></div><div class="field"><label>Chapitre</label><select class="input"><option>Chapitre 3 – PL/SQL</option></select></div><div class="field"><label>Fichier ou lien</label><div class="choice sel">${ico('file')}<span>Chapitre4-Declencheurs.pdf · 1,1 Mo</span></div></div><p class="hint">Les PDF sont découpés et indexés pour l'Assistant IA en arrière-plan.</p><div class="actions"><button class="btn text" type="button" data-act="close">Annuler</button><button class="btn primary" type="button" data-act="ajoutress">Ajouter</button></div>`,
    inviter: `<h2>Inviter des personnes</h2><div class="field"><label for="ii">Rechercher par nom ou prénom</label><input id="ii" class="input" value="Ben"></div><div class="list"><label class="list-item clickable"><input type="checkbox" checked><span class="avatar sm">NB</span>Nour Ben Ali · Étudiant</label><label class="list-item clickable"><input type="checkbox"><span class="avatar sm">SB</span>Salma Ben Romdhane · Étudiant</label></div><p class="hint">L'invitation expire au bout de 14 jours.</p><div class="actions"><button class="btn text" type="button" data-act="close">Annuler</button><button class="btn primary" type="button" data-act="closetoast" data-a="1 invitation envoyée.">Inviter</button></div>`,
    import: `<h2>Importer des comptes autorisés</h2>
      ${S.importApercu ? `<div class="alert info">${ico('info')}<div><b>40 lignes lues</b> : 38 valides, 2 erreurs. Rien n'est enregistré avant la validation.</div></div>
        <div class="table-wrap"><table><thead><tr><th>Ligne</th><th>Matricule</th><th>Erreur</th></tr></thead><tbody><tr><td>12</td><td>ETU-2026-012</td><td class="muted">E-mail invalide</td></tr><tr><td>27</td><td>ETU-2026-027</td><td class="muted">Classe inconnue : L2-INFO-Z</td></tr></tbody></table></div>
        <div class="actions"><button class="btn text" type="button" data-act="close">Annuler</button><button class="btn primary" type="button" data-act="closetoast" data-a="38 comptes autorisés importés.">Importer les 38 lignes valides</button></div>`
        : `<div class="choice sel">${ico('upload')}<div><b style="font-weight:500">comptes-L2-2026.xlsx</b><br><span class="muted small">Colonnes : matricule, nom, prenom, email, profil, classe_code</span></div></div>
        <div class="actions"><button class="btn text" type="button" data-act="close">Annuler</button><button class="btn primary" type="button" data-act="apercu">Voir l'aperçu</button></div>`}`,
    generer: `<h2>Générer les groupes 2026/2027</h2><div class="alert info">${ico('info')}<div>Aperçu : <b>12 groupes</b> seront créés (3 classes, 9 matières) et <b>96 membres</b> rattachés. Les groupes déjà existants ne sont pas recréés.</div></div><div class="actions"><button class="btn text" type="button" data-act="close">Annuler</button><button class="btn primary" type="button" data-act="generer">Générer</button></div>`,
  }[S.dialog]
  return `<div class="overlay" data-act="closeov"><div class="dialog" role="dialog" aria-modal="true">${d}</div></div>`
}

/* ------------------------------------------------------------------ rendu */
function render() {
  const root = document.getElementById('root')
  if (!S.connecte) {
    root.innerHTML = strip() + auth() + dialog() + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '')
    return
  }
  const pages = { accueil, notifications, espace, wizard, annees, referentiels, comptes, groupes }
  root.innerHTML = strip() + `<div class="app">${topbar()}${drawer()}<main class="main">${(pages[S.vue] || accueil)()}</main></div>` + bottomNav() + dialog() + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '')
  const chat = document.getElementById('chat')
  if (chat) chat.scrollTop = chat.scrollHeight
}

/* ------------------------------------------------------------------ actions */
function poser(q) {
  if (!S.quota || !q.trim()) return
  S.quota -= 1
  const horsCours = /capitale|météo|football/i.test(q)
  S.ia.push(horsCours ? { q, sansSource: true } : { q, r: QR.r, sources: QR.sources, avis: null })
  render()
}
const ACTIONS = {
  role: (a) => { S.role = a; S.vue = 'accueil'; S.ia = []; S.sourceActive = {}; S.dialog = null; render() },
  auth: (a) => { S.ecranAuth = a; render() },
  logout: () => { S.connecte = false; S.ecranAuth = 'connexion'; render() },
  go: (a) => go(a),
  drawer: () => { S.drawer = !S.drawer; render() },
  espace: (a, el) => go('espace', { espaceId: +a, onglet: el.dataset.o || 'discussion', hl: null }),
  onglet: (a) => { S.onglet = a; if (a !== 'ressources') S.hl = null; render() },
  toast: (a) => toast(a),
  dialog: (a) => { S.dialog = a; S.importApercu = false; render() },
  close: () => { S.dialog = null; render() },
  closeov: (a, el, ev) => { if (ev.target === el) ACTIONS.close() },
  closetoast: (a) => { S.dialog = null; toast(a) },
  accepter: (a) => {
    D.invitations[S.role] = invitations().filter((i) => i.id !== +a)
    D.espaces.push({ id: 5, type: 'PRIVE', icone: 'lock', nom: 'Révisions BD', visibilite: '7 jours', membres: 6, roles: { [S.role]: 'MEMBRE' }, assistant: false, nonLus: 0 })
    go('espace', { espaceId: 5, onglet: 'discussion' })
    toast('Invitation acceptée : vous êtes membre de « Révisions BD ».')
  },
  refuser: (a) => { D.invitations[S.role] = invitations().filter((i) => i.id !== +a); toast('Invitation refusée.') },
  lire: (a) => { const n = D.notifications.find((x) => x.id === +a); n.lue = true; render() },
  toutlire: () => { D.notifications.forEach((n) => { n.lue = true }); render() },
  pj: () => { S.pj = 'exercices-curseurs.pdf'; render() },
  pjx: () => { S.pj = null; render() },
  poser: (a) => poser(a),
  nouvelle: () => { S.ia = []; S.sourceActive = {}; render() },
  cite: (a, el) => { S.sourceActive = { ...S.sourceActive, [a]: +el.dataset.n }; render() },
  source: (a) => { S.onglet = 'ressources'; S.hl = +a; render() },
  avis: (a, el) => { S.ia[+a].avis = +el.dataset.v; toast('Merci pour votre avis.') },
  assistant: () => { S.assistantActif[S.espaceId] = !S.assistantActif[S.espaceId]; toast(S.assistantActif[S.espaceId] ? 'Assistant IA activé : l\'onglet est visible par les membres.' : 'Assistant IA désactivé.') },
  publier: () => { D.annonces[S.espaceId] = [{ titre: 'Rappel : rendu du projet', texte: 'Le rendu du mini-projet est fixé au 30/11 à 23 h 59 sur la plateforme.', auteur: `${user().prenom} ${user().nom}`, date: '19 nov. 2026' }, ...(D.annonces[S.espaceId] || [])]; S.dialog = null; toast('Annonce publiée : les membres ont été notifiés.') },
  ajoutress: () => { const c = D.chapitres[S.espaceId]; if (c) c[2].ress.push({ id: 15, nom: 'Chapitre 4 – Déclencheurs.pdf', taille: '1,1 Mo', indexee: true }); S.dialog = null; toast('Ressource ajoutée. Indexation pour l\'IA terminée.') },
  wizard: () => go('wizard', { wizard: { etape: 0, nom: '', desc: '', duree: '7 jours', inv0: true, inv1: false } }),
  wnext: () => { S.wizard.etape += 1; render() },
  wprev: () => { S.wizard.etape -= 1; render() },
  wcreer: () => {
    const w = S.wizard
    D.espaces.push({ id: 6, type: 'PRIVE', icone: 'lock', nom: w.nom, visibilite: w.duree, membres: 1, roles: { [S.role]: 'PROPRIETAIRE' }, assistant: false, nonLus: 0 })
    go('espace', { espaceId: 6, onglet: 'membres' })
    toast('Espace créé. Les invitations ont été envoyées.')
  },
  activer: (a) => { D.annees.forEach((x, i) => { x.active = i === +a }); toast(`Année ${D.annees[+a].libelle} activée.`) },
  ref: (a) => { S.refOnglet = a; render() },
  apercu: () => { S.importApercu = true; render() },
  generer: () => { S.groupesGeneres = true; S.dialog = null; toast('12 groupes créés, 96 membres rattachés.') },
}
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]')
  if (!el) return
  const f = ACTIONS[el.dataset.act]
  if (f) f(el.dataset.a, el, ev)
})
document.addEventListener('input', (ev) => {
  const k = ev.target.dataset.w
  if (!k || !S.wizard) return
  S.wizard[k] = ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value
  if (k === 'nom') {
    const b = document.querySelector('[data-act="wnext"]')
    if (b) b.disabled = S.wizard.nom.trim().length < 3
  }
  if (k === 'duree') render()
})
document.addEventListener('submit', (ev) => {
  ev.preventDefault()
  const f = ev.target
  switch (f.dataset.submit) {
    case 'connexion': S.connecte = true; S.vue = 'accueil'; render(); break
    case 'inscription': S.ecranAuth = 'envoye'; render(); break
    case 'activation': S.connecte = true; S.vue = 'accueil'; toast('Compte activé : vos groupes de classe ont été rejoints automatiquement.'); break
    case 'message': {
      const t = f.texte.value.trim()
      if (!t && !S.pj) return
      const u = user()
      D.messages[S.espaceId] = [...(D.messages[S.espaceId] || []), { id: Date.now(), auteur: `${u.prenom} ${u.nom}`, initiales: initiales(u), badge: u.profil === 'Enseignant' ? 'Enseignant' : null, heure: '10:30', texte: t, pj: S.pj ? { nom: S.pj, taille: '256 Ko' } : null, jour: "Aujourd'hui" }]
      S.pj = null
      render()
      break
    }
    case 'question': poser(f.q.value); break
  }
})
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && S.dialog) ACTIONS.close() })
render()
</script>
</body>
</html>
