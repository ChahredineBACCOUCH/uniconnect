<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accès refusé / Page introuvable – UniConnect</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,Arial,sans-serif;font-size:14px;line-height:1.43;color:#1C2333;background:#F4F6FB}
a{color:#1E4FB8;text-decoration:none}a:hover{color:#163C8C;text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.i{width:22px;height:22px;fill:currentColor;flex:none}
.app{min-height:100vh;display:flex;flex-direction:column}
.v-app-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;min-height:64px;padding:0 16px 0 12px;background:#fff;border-bottom:1px solid #D5DBE7}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:#1E4FB8;width:228px;flex:none}
.brand:hover{text-decoration:none;color:#1E4FB8}
.brand-mark{width:36px;height:36px;border-radius:8px;background:#1E4FB8;color:#fff;display:grid;place-items:center}
.search{flex:0 1 520px;display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:999px;background:#EEF2FA;color:#5B6478}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:#1C2333}
.spacer{flex:1}
.icon-btn{position:relative;width:44px;height:44px;border:0;border-radius:999px;background:transparent;color:#5B6478;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:#EEF2FA;color:#1C2333}
.dot{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#C62828;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.user{display:flex;align-items:center;gap:10px;color:#1C2333}.user:hover{text-decoration:none;color:#1C2333}
.v-avatar{width:40px;height:40px;border-radius:999px;display:inline-grid;place-items:center;font-weight:500;color:#fff;background:#1E4FB8;flex:none}
.v-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:4px;border:1px solid transparent;font-weight:500;font-size:14px;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;text-decoration:none;white-space:nowrap;background:transparent}
.v-btn .i{width:18px;height:18px}.v-btn:hover{text-decoration:none}
.v-btn--flat{background:#1E4FB8;color:#fff;box-shadow:0 2px 3px -1px rgba(0,0,0,.2)}.v-btn--flat:hover{background:#163C8C;color:#fff}
.v-btn--outlined{border-color:#1E4FB8;color:#1E4FB8}.v-btn--outlined:hover{background:#E3EBFB}
.v-btn--text{color:#1E4FB8;padding:0 10px}.v-btn--text:hover{background:#E3EBFB}
.muted{color:#5B6478}.caption{font-size:12px;line-height:16px;color:#5B6478}
.err{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 16px}
.err-card{max-width:560px;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.err-ico{width:96px;height:96px;border-radius:999px;display:grid;place-items:center}
.err-ico .i{width:48px;height:48px}
.code{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.seg{display:inline-flex;border:1px solid #1E4FB8;border-radius:4px;overflow:hidden;margin-top:24px}
.seg button{border:0;background:#fff;color:#1E4FB8;font-weight:500;padding:0 14px;height:36px;cursor:pointer;font-size:13px}
.seg button.on{background:#1E4FB8;color:#fff}
@media (max-width:1100px){.brand{width:auto}}
@media (max-width:960px){.search{display:none}.user-text{display:none}}
</style>
</helmet>
<div class="app">
  <header class="v-app-bar">
    <button class="icon-btn" type="button" aria-label="Ouvrir le menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.menu}}"></path></svg></button>
    <a class="brand" href="E04-Accueil.dc.html"><span class="brand-mark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.school}}"></path></svg></span>UniConnect</a>
    <label class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.magnify}}"></path></svg><input type="search" aria-label="Rechercher" placeholder="Rechercher un espace, une personne, un fichier…"></label>
    <span class="spacer"></span>
    <a class="icon-btn" href="E09-Notifications.dc.html" aria-label="Notifications, 4 non lues"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.bell}}"></path></svg><span class="dot">4</span></a>
    <a class="user" href="E11-Profil.dc.html" ><span class="v-avatar">YB</span><span class="user-text"><span style="display:block;font-weight:500">Yassine Ben Salah</span><span class="caption">Étudiant · L2 Informatique</span></span></a>
  </header>
  <main class="err">
    <div class="err-card">
      <span class="err-ico" style="{{v.icoStyle}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{v.d}}"></path></svg></span>
      <span class="code" style="{{v.codeStyle}}">{{v.code}}</span>
      <h1 style="font-size:28px;line-height:36px;font-weight:500">{{v.title}}</h1>
      <p class="muted" style="font-size:16px;line-height:24px">{{v.text}}</p>
      <p class="caption">{{v.hint}}</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
        <a class="v-btn v-btn--flat" href="E04-Accueil.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ic.home}}"></path></svg>Retour à l'accueil</a>
        <a class="v-btn v-btn--outlined" href="{{v.altHref}}">{{v.alt}}</a>
      </div>
      <div class="seg" role="group" aria-label="Variante affichée (démo)"><sc-for list="{{variants}}" as="o" hint-placeholder-count="2"><button class="{{o.cls}}" type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
    </div>
  </main>
</div>
</x-dc>

</body>
</html>
